<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>WMC Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  background: linear-gradient(160deg, #0d3b5e 0%, #0a7153 100%);
  color: white;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  text-align: center;
}
.logo { font-size: 64px; margin-bottom: 16px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
.sub { font-size: 13px; color: rgba(255,255,255,0.65); margin-top: 4px; margin-bottom: 24px; }
.badge {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 999px;
  padding: 7px 20px;
  font-size: 14px;
  margin-bottom: 36px;
  letter-spacing: 0.2px;
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  max-width: 320px;
  padding: 18px 20px;
  border-radius: 16px;
  font-size: 18px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  border: none;
  background: white;
  color: #0d3b5e;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  transition: transform 0.1s, opacity 0.1s;
}
.btn:active { transform: scale(0.97); opacity: 0.9; }
.progress-ring {
  width: 22px; height: 22px;
  flex-shrink: 0;
}
.progress-ring circle {
  fill: none;
  stroke: #0d3b5e;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset 1s linear;
}
.hint {
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  margin-top: 28px;
  line-height: 1.8;
}
</style>
</head>
<body>

<div class="logo">🏥</div>
<h1>WMC Daily Dashboard</h1>
<div class="sub">โรงพยาบาลเวิลด์เมดิคอล</div>
<div class="badge" id="badge">⏳ กำลังโหลด...</div>

<a class="btn" id="btn" href="#">
  <svg class="progress-ring" viewBox="0 0 22 22">
    <circle id="ring" cx="11" cy="11" r="9"/>
  </svg>
  <span id="btn-text">กำลังเปิด Dashboard...</span>
</a>

<p class="hint" id="hint"></p>

<script>
(function () {
  var EN = ["","January","February","March","April","May","June",
            "July","August","September","October","November","December"];
  var TH = ["","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
            "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

  var now  = new Date();
  var y    = now.getFullYear();
  var mo   = now.getMonth() + 1;
  var d    = now.getDate();

  function fname(yy, mm) { return 'WMC_Monthly_Dashboard_' + EN[mm] + yy + '.html'; }
  function ver(yy, mm)   { return '' + yy + ('0'+mm).slice(-2) + ('0'+d).slice(-2); }
  function urlFor(yy, mm) { return fname(yy, mm) + '?v=' + ver(yy, mm); }

  // เดือนก่อนหน้า — ใช้เป็น fallback ถ้าเดือนนี้ยังไม่มี Dashboard
  // (ต้นเดือน ข้อมูลวันแรกจาก callcenter ยังมาไม่ถึง ไฟล์เดือนใหม่จึงยังไม่ถูกสร้าง)
  var py = y, pmo = mo - 1;
  if (pmo < 1) { pmo = 12; py = y - 1; }

  var curFile = fname(y, mo);
  var curUrl  = urlFor(y, mo);
  var prevUrl = urlFor(py, pmo);

  var be  = y + 543;
  var pbe = py + 543;

  function setUI(monthLabel, btnLabel, hintExtra) {
    document.getElementById('badge').textContent = monthLabel + '  ·  วันที่ ' + d;
    document.getElementById('btn-text').textContent = '📊  เปิด Dashboard ' + btnLabel;
    document.getElementById('hint').textContent =
      'ข้อมูล ณ วันที่ ' + ('0'+d).slice(-2) + '/' + ('0'+mo).slice(-2) + '/' + be +
      (hintExtra ? '\n' + hintExtra : '') +
      '\nหากไม่เปิดอัตโนมัติ กดปุ่มด้านบน';
  }

  // ตั้งค่าเริ่มต้นเป็นเดือนปัจจุบันไปก่อน (เผื่อเช็คไฟล์ไม่ทัน/ล้มเหลว)
  var finalUrl = curUrl;
  document.getElementById('btn').href = curUrl;
  setUI(TH[mo] + ' ' + be, TH[mo] + ' ' + be, null);

  // เช็คว่าไฟล์ Dashboard เดือนนี้มีอยู่จริงไหมก่อน redirect
  // ถ้ายังไม่มี (ต้นเดือน) → ใช้ Dashboard เดือนก่อนหน้าแทน (ข้อมูลล่าสุดที่มี)
  fetch(curFile, { method: 'HEAD', cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('not found');
    })
    .catch(function () {
      finalUrl = prevUrl;
      document.getElementById('btn').href = prevUrl;
      setUI(
        TH[mo] + ' ' + be,
        TH[pmo] + ' ' + pbe + ' (ล่าสุด)',
        '⚠️ ยังไม่มีข้อมูลเดือน' + TH[mo] + ' — แสดงข้อมูลเดือน' + TH[pmo] + ' แทน'
      );
    });

  // Animate progress ring & auto-redirect in 2s
  var ring = document.getElementById('ring');
  setTimeout(function() {
    ring.style.strokeDashoffset = '0';
  }, 50);
  var t = setTimeout(function() {
    window.location.replace(finalUrl);
  }, 2100);

  // Manual tap cancels countdown and goes immediately
  document.getElementById('btn').addEventListener('click', function(e) {
    e.preventDefault();
    clearTimeout(t);
    window.location.href = finalUrl;
  });
})();
</script>
</body>
</html>
